# Deploys the static site to GitHub Pages on every push to main (including
# pushes made by Claude's GitHub App, which don't start Pages' built-in
# "deploy from a branch" build). Requires Settings -> Pages -> Source:
# "GitHub Actions".
#
# js/version.js is stamped here with the exact deployed commit, in the
# deployed copy only - nothing is committed back (scripts/stamp-version.sh
# is no longer needed for deploys).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm ci && npm test

      - name: Stamp js/version.js
        run: |
          cat > js/version.js <<JS
          // Stamped at deploy time by .github/workflows/pages.yml.
          export const VERSION = {
            commit: '$(git rev-parse --short HEAD)',
            builtAt: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")',
          };
          JS

      # The whole repo, as the branch build served it, minus git and
      # test-only dependencies.
      - name: Collect site files
        run: rsync -a --exclude .git --exclude node_modules --exclude _site ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
