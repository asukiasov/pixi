<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pixi</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Resolves bare "dexie" imports in js/persistence.js to a CDN build, no
       npm/bundler for the shipped app. Node resolves the same bare
       specifier from node_modules, for `node --test` only. -->
  <script type="importmap">
    { "imports": { "dexie": "https://esm.sh/dexie@4" } }
  </script>
  <!-- Google Material Symbols, for tool/undo/redo icons (see style.css).
       A single static axis point (not a variable-font range) plus
       icon_names subsetting to just the glyphs actually used — the
       original range query pulled the full variable font (~4MB, ~30s on a
       slow connection, icons invisible until it finished); this is a few
       KB. Keep icon_names in sync with the icons used in this file. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=edit,ink_eraser,format_color_fill,brush,horizontal_rule,rectangle,crop_free,back_hand,undo,redo,add,remove,delete,visibility,visibility_off" />
</head>
<body>
  <main id="screen-gallery" class="screen">
    <div class="gallery-header">
      <h1>Pixi</h1>
      <button type="button" id="gallery-new-canvas-button" class="primary-button">+ New Canvas</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <p id="gallery-empty-state" class="gallery-empty-state hidden">
      No projects yet — tap "+ New Canvas" to start one.
    </p>
  </main>

  <main id="screen-new-canvas" class="screen hidden">
    <h1>New Canvas</h1>

    <section class="field-group">
      <h2>Size</h2>
      <div class="preset-row" id="size-presets">
        <button type="button" class="preset-button" data-size="16">16×16</button>
        <button type="button" class="preset-button" data-size="32">32×32</button>
        <button type="button" class="preset-button" data-size="64">64×64</button>
        <button type="button" class="preset-button" data-size="128">128×128</button>
      </div>
      <div class="custom-size-row">
        <label>W <input type="number" id="custom-width" min="1" max="256" placeholder="custom" /></label>
        <label>H <input type="number" id="custom-height" min="1" max="256" placeholder="custom" /></label>
      </div>
    </section>

    <section class="field-group">
      <h2>Background</h2>
      <div class="preset-row" id="background-choice">
        <label><input type="radio" name="background" value="transparent" checked /> Transparent</label>
        <label><input type="radio" name="background" value="white" /> White</label>
      </div>
    </section>

    <button type="button" id="create-canvas-button" class="primary-button">Create</button>
  </main>

  <main id="screen-workspace" class="screen workspace-screen hidden">
    <!-- 1. Tools: vertical icon rail, Photoshop-style. -->
    <aside id="tools-sidebar" class="tools-sidebar">
      <button type="button" class="tool-button" data-tool="pencil" aria-label="Pencil" data-tooltip="Pencil" data-shortcut="P">
        <span class="material-symbols-outlined">edit</span>
      </button>
      <button type="button" class="tool-button" data-tool="eraser" aria-label="Eraser" data-tooltip="Eraser" data-shortcut="E">
        <span class="material-symbols-outlined">ink_eraser</span>
      </button>
      <button type="button" class="tool-button" data-tool="bucket" aria-label="Bucket" data-tooltip="Bucket" data-shortcut="G">
        <span class="material-symbols-outlined">format_color_fill</span>
      </button>
      <button type="button" class="tool-button" data-tool="brush" aria-label="Brush" data-tooltip="Brush" data-shortcut="B">
        <span class="material-symbols-outlined">brush</span>
      </button>
      <button type="button" class="tool-button" data-tool="line" aria-label="Line" data-tooltip="Line" data-shortcut="L">
        <span class="material-symbols-outlined">horizontal_rule</span>
      </button>
      <button type="button" class="tool-button" data-tool="rectangle" aria-label="Rectangle" data-tooltip="Rectangle" data-shortcut="R">
        <span class="material-symbols-outlined">rectangle</span>
      </button>
      <button type="button" class="tool-button" data-tool="selection" aria-label="Select" data-tooltip="Select (click outside or Esc to deselect)" data-shortcut="M">
        <span class="material-symbols-outlined">crop_free</span>
      </button>
      <button type="button" class="tool-button" data-tool="hand" aria-label="Hand (pan)" data-tooltip="Hand" data-shortcut="H">
        <span class="material-symbols-outlined">back_hand</span>
      </button>
    </aside>

    <div class="workspace-main">
      <div id="workspace-canvas-container" class="canvas-container">
        <canvas id="workspace-canvas"></canvas>
      </div>

      <div id="canvas-settings-panel" class="canvas-settings-panel hidden">
        <div class="canvas-settings-row">
          <h2>Canvas Settings</h2>
        </div>
        <div class="canvas-settings-row">
          <label class="canvas-settings-name-label">Name
            <input type="text" id="canvas-settings-name" placeholder="Untitled" />
          </label>
        </div>
        <div class="canvas-settings-row">
          <label>W <input type="number" id="canvas-settings-width" min="1" max="256" /></label>
          <label>H <input type="number" id="canvas-settings-height" min="1" max="256" /></label>
          <button type="button" id="canvas-settings-apply" class="tool-button">Resize</button>
        </div>
        <div class="canvas-settings-row">
          <button type="button" id="canvas-settings-rotate-ccw" class="tool-button">Rotate ↺</button>
          <button type="button" id="canvas-settings-rotate-cw" class="tool-button">Rotate ↻</button>
        </div>
      </div>

      <div id="palette-row" class="palette-row"></div>

      <div id="selection-controls" class="selection-controls hidden">
        <button type="button" id="selection-clear-button" class="tool-button">Clear selection</button>
        <button type="button" id="selection-delete-button" class="tool-button">Delete</button>
      </div>

      <nav class="bottom-bar">
        <!-- 1. Zoom: bottom-left, per the canvas-navigation spec. -->
        <div class="bottom-bar-group zoom-controls">
          <button type="button" id="zoom-out-button" class="tool-button icon-button" title="Zoom out (Ctrl/Cmd -)">
            <span class="material-symbols-outlined">remove</span>
          </button>
          <span id="zoom-readout" class="zoom-readout">100%</span>
          <button type="button" id="zoom-in-button" class="tool-button icon-button" title="Zoom in (Ctrl/Cmd +)">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="zoom-preset-100" class="tool-button" title="Actual size">100%</button>
          <button type="button" id="zoom-preset-fit" class="tool-button" title="Fit the canvas to the screen">Fit</button>
          <button type="button" id="zoom-preset-fill" class="tool-button" title="Fill the screen with the canvas">Fill</button>
        </div>
        <!-- 2. Additional: navigation, toggles, settings, export. -->
        <div class="bottom-bar-group">
          <button type="button" id="back-to-gallery-button" class="tool-button">Gallery</button>
          <button type="button" id="pixel-perfect-toggle" class="tool-button">Pixel-perfect</button>
          <button type="button" id="layers-panel-toggle" class="tool-button active">Layers</button>
          <button type="button" id="canvas-settings-toggle" class="tool-button">Canvas Settings</button>
          <button type="button" id="export-button" class="tool-button">Export PNG</button>
        </div>
        <!-- 3. Undo/redo. -->
        <div class="bottom-bar-group">
          <button type="button" id="undo-button" class="tool-button icon-button" disabled title="Undo">
            <span class="material-symbols-outlined">undo</span>
          </button>
          <button type="button" id="redo-button" class="tool-button icon-button" disabled title="Redo">
            <span class="material-symbols-outlined">redo</span>
          </button>
        </div>
      </nav>
    </div>

    <!-- Separate right-hand sidebar, not part of workspace-main's vertical
         stack. Layers is always relevant (shown/hidden by its own toggle,
         see #layers-panel-toggle above); Brushes is scoped to the Brush
         tool (see js/workspace.js) - both independent of each other. -->
    <aside id="right-sidebar" class="right-sidebar">
      <div id="layers-panel" class="layers-panel">
        <div class="layers-panel-header">
          <h2>Layers</h2>
          <button type="button" id="add-layer-button" class="tool-button">+ Layer</button>
        </div>
        <div id="layers-panel-list" class="layers-panel-list"></div>
      </div>

      <div id="brushes-panel" class="brushes-panel">
        <div class="brushes-panel-header">
          <h2>Brushes</h2>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Spacing
            <input type="number" id="brush-spacing" min="1" max="20" value="1" /> px
          </label>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Rotation
            <input type="number" id="brush-rotation" min="0" max="359" value="0" /> °
          </label>
        </div>
        <div id="brushes-panel-grid" class="brushes-panel-grid"></div>
        <div class="brushes-panel-toolbar">
          <button type="button" id="add-brush-button" class="tool-button icon-button" title="Add brush">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="delete-brush-button" class="tool-button icon-button" disabled title="Delete selected brush">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>

        <div id="brush-editor-panel" class="brush-editor-panel hidden">
          <div class="brush-editor-row">
            <h2>New Brush</h2>
          </div>
          <div class="brush-editor-row">
            <input type="text" id="brush-editor-name" placeholder="Brush name" />
          </div>
          <div class="brush-editor-row">
            <label class="brush-editor-size-label">W
              <input type="number" id="brush-editor-width" min="3" value="9" />
            </label>
            <label class="brush-editor-size-label">H
              <input type="number" id="brush-editor-height" min="3" value="9" />
            </label>
          </div>
          <div id="brush-editor-grid" class="brush-editor-grid"></div>
          <div class="brush-editor-row">
            <button type="button" id="brush-editor-clear" class="tool-button">Clear</button>
            <button type="button" id="brush-editor-cancel" class="tool-button">Cancel</button>
            <button type="button" id="brush-editor-save" class="tool-button">Save</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
