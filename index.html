<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pixi</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Resolves bare "dexie" imports in js/persistence.js to a CDN build, no
       npm/bundler for the shipped app. Node resolves the same bare
       specifier from node_modules, for `node --test` only. -->
  <script type="importmap">
    { "imports": { "dexie": "https://esm.sh/dexie@4" } }
  </script>
  <!-- Google Material Symbols, for tool/undo/redo icons (see style.css).
       A single static axis point (not a variable-font range) plus
       icon_names subsetting to just the glyphs actually used — the
       original range query pulled the full variable font (~4MB, ~30s on a
       slow connection, icons invisible until it finished); this is a few
       KB. Keep icon_names in sync with the icons used in this file. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=edit,ink_eraser,format_color_fill,brush,horizontal_rule,rectangle,crop_free,back_hand,colorize,undo,redo,add,remove,delete,visibility,visibility_off,restart_alt,swap_horiz,close,home,grid_on,layers,settings,download,arrow_upward,arrow_downward,rotate_left,rotate_right,check_box_outline_blank,check_box,palette,arrow_selector_tool,playlist_add,opacity" />
</head>
<body>
  <main id="screen-gallery" class="screen">
    <div class="gallery-header">
      <h1>Pixi</h1>
      <button type="button" id="gallery-new-canvas-button" class="primary-button">+ New Canvas</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <p id="gallery-empty-state" class="gallery-empty-state hidden">
      No projects yet — tap "+ New Canvas" to start one.
    </p>
  </main>

  <main id="screen-new-canvas" class="screen hidden">
    <h1>New Canvas</h1>

    <section class="field-group">
      <h2>Size</h2>
      <div class="preset-row" id="size-presets">
        <button type="button" class="preset-button" data-size="16">16×16</button>
        <button type="button" class="preset-button" data-size="32">32×32</button>
        <button type="button" class="preset-button" data-size="64">64×64</button>
        <button type="button" class="preset-button" data-size="128">128×128</button>
      </div>
      <div class="custom-size-row">
        <label>W <input type="number" id="custom-width" min="1" max="256" placeholder="custom" /></label>
        <label>H <input type="number" id="custom-height" min="1" max="256" placeholder="custom" /></label>
      </div>
    </section>

    <section class="field-group">
      <h2>Background</h2>
      <div class="preset-row" id="background-choice">
        <label><input type="radio" name="background" value="transparent" checked /> Transparent</label>
        <label><input type="radio" name="background" value="white" /> White</label>
      </div>
    </section>

    <button type="button" id="create-canvas-button" class="primary-button">Create</button>
  </main>

  <main id="screen-workspace" class="screen workspace-screen hidden">
    <!-- Top bar: navigation/toggles/settings/export, icon-only. Separate
         from the tool rail below - these aren't drawing tools. -->
    <header class="workspace-topbar">
      <button type="button" id="back-to-gallery-button" class="tool-button icon-button" aria-label="Gallery" data-tooltip="Gallery">
        <span class="material-symbols-outlined">home</span>
      </button>
      <button type="button" id="pixel-perfect-toggle" class="tool-button icon-button" aria-label="Pixel-perfect" data-tooltip="Pixel-perfect">
        <span class="material-symbols-outlined">grid_on</span>
      </button>
      <button type="button" id="layers-panel-toggle" class="tool-button icon-button active" aria-label="Layers" data-tooltip="Layers">
        <span class="material-symbols-outlined">layers</span>
      </button>
      <button type="button" id="canvas-settings-toggle" class="tool-button icon-button" aria-label="Canvas Settings" data-tooltip="Canvas Settings">
        <span class="material-symbols-outlined">settings</span>
      </button>
      <button type="button" id="export-button" class="tool-button icon-button" aria-label="Export PNG" data-tooltip="Export PNG">
        <span class="material-symbols-outlined">download</span>
      </button>

      <div class="workspace-topbar-spacer"></div>

      <button type="button" id="undo-button" class="tool-button icon-button" disabled aria-label="Undo" data-tooltip="Undo">
        <span class="material-symbols-outlined">undo</span>
      </button>
      <button type="button" id="redo-button" class="tool-button icon-button" disabled aria-label="Redo" data-tooltip="Redo">
        <span class="material-symbols-outlined">redo</span>
      </button>
    </header>

    <div class="workspace-body">
    <!-- 1. Tools: vertical icon rail, Photoshop-style. -->
    <aside id="tools-sidebar" class="tools-sidebar">
      <button type="button" class="tool-button" data-tool="pencil" aria-label="Pencil" data-tooltip="Pencil" data-shortcut="P">
        <span class="material-symbols-outlined">edit</span>
      </button>
      <button type="button" class="tool-button" data-tool="eraser" aria-label="Eraser" data-tooltip="Eraser" data-shortcut="E">
        <span class="material-symbols-outlined">ink_eraser</span>
      </button>
      <button type="button" class="tool-button" data-tool="bucket" aria-label="Bucket" data-tooltip="Bucket" data-shortcut="G">
        <span class="material-symbols-outlined">format_color_fill</span>
      </button>
      <button type="button" class="tool-button" data-tool="brush" aria-label="Brush" data-tooltip="Brush" data-shortcut="B">
        <span class="material-symbols-outlined">brush</span>
      </button>
      <button type="button" class="tool-button" data-tool="line" aria-label="Line" data-tooltip="Line" data-shortcut="L">
        <span class="material-symbols-outlined">horizontal_rule</span>
      </button>
      <button type="button" class="tool-button" data-tool="rectangle" aria-label="Rectangle" data-tooltip="Rectangle" data-shortcut="R">
        <span class="material-symbols-outlined">rectangle</span>
      </button>
      <button type="button" class="tool-button" data-tool="selection" aria-label="Select" data-tooltip="Select (click outside or Esc to deselect)" data-shortcut="M">
        <span class="material-symbols-outlined">crop_free</span>
      </button>
      <button type="button" class="tool-button" data-tool="move" aria-label="Move" data-tooltip="Move" data-shortcut="V">
        <span class="material-symbols-outlined">arrow_selector_tool</span>
      </button>
      <button type="button" class="tool-button" data-tool="hand" aria-label="Hand (pan)" data-tooltip="Hand" data-shortcut="H">
        <span class="material-symbols-outlined">back_hand</span>
      </button>
      <button type="button" class="tool-button" data-tool="eyedropper" aria-label="Eyedropper" data-tooltip="Eyedropper" data-shortcut="I">
        <span class="material-symbols-outlined">colorize</span>
      </button>

      <!-- Foreground/Background - always relevant (not tool-scoped),
           unlike the Pencil options below. Reset/swap are small icons
           overlapping the swatch stack's corners (Photoshop-style),
           not full-size buttons stacked above/below it. -->
      <div class="fg-bg-swatches">
        <div class="fg-bg-swatch-stack">
          <button type="button" id="background-swatch" class="fg-bg-swatch bg-swatch" aria-label="Background color" data-tooltip="Background color"></button>
          <button type="button" id="foreground-swatch" class="fg-bg-swatch fg-swatch" aria-label="Foreground color" data-tooltip="Foreground color"></button>
          <button type="button" id="fg-bg-swap" class="fg-bg-corner-button swap-corner" aria-label="Swap colors" data-tooltip="Swap colors">
            <span class="material-symbols-outlined">swap_horiz</span>
          </button>
          <button type="button" id="fg-bg-reset" class="fg-bg-corner-button reset-corner" aria-label="Reset colors" data-tooltip="Reset colors">
            <span class="material-symbols-outlined">restart_alt</span>
          </button>
        </div>
      </div>

      <!-- Popover opened by clicking either FG/BG swatch above - edits
           whichever one was clicked (js/workspace.js tracks the target).
           Positioned via fixed + JS (getBoundingClientRect), clamped to
           the viewport, so its DOM location doesn't matter. -->
      <div id="color-picker-popover" class="color-picker-popover hidden">
        <div class="color-picker-popover-header">
          <span id="color-picker-popover-title">Foreground Color</span>
          <button type="button" id="color-picker-close" class="icon-button" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <input type="color" id="color-picker-native" value="#000000" title="Custom color" />
        <div class="color-picker-hex-row">
          <input type="text" id="color-picker-hex" class="color-picker-hex" value="#000000" maxlength="7" placeholder="#000000" aria-label="Hex" title="Double-click to copy" />
          <span id="color-picker-copied" class="color-picker-copied hidden">Copied!</span>
        </div>
        <div class="color-picker-rgb-row">
          <input type="number" id="color-picker-r" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Red" />
          <input type="number" id="color-picker-g" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Green" />
          <input type="number" id="color-picker-b" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Blue" />
        </div>
        <button type="button" id="color-picker-add" class="tool-button">
          <span class="material-symbols-outlined">add</span> Add to palette
        </button>
      </div>

      <!-- Shown only while Pencil or Eraser is active (js/workspace.js),
           same tool-scoped-visibility pattern the Brushes panel uses. -->
      <!-- Rectangle's Filled toggle - tool-scoped like Pencil options below. -->
      <div id="rectangle-options" class="rectangle-options hidden">
        <!-- Inline SVGs (Material Symbols' actual "rectangle" glyph,
             outline and solid-fill variants), not the font icon used
             elsewhere - the subsetted icon webfont only bakes a single
             fixed FILL-axis point (0, outline), so it can't render a
             true solid variant of the same glyph at runtime; these two
             raw paths are fetched once from Google's static icon SVG
             CDN, same source as the font, and swapped via visibility
             instead. Was check_box/check_box_outline_blank - changed
             per feedback that those didn't read as "filled rectangle". -->
        <button type="button" id="rectangle-fill-toggle" class="tool-button icon-button" aria-label="Filled" data-tooltip="Filled rectangle">
          <svg id="rectangle-fill-icon-outline" class="rectangle-fill-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M80-160v-640h800v640H80Zm80-80h640v-480H160v480Zm0 0v-480 480Z"/></svg>
          <svg id="rectangle-fill-icon-filled" class="rectangle-fill-icon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M80-160v-640h800v640H80Z"/></svg>
        </button>
      </div>

      <!-- 1:1 (square) proportion toggle - shown for Rectangle and
           Selection, an on/off equivalent of holding Shift while
           dragging (see squareDragCurrent/shiftHeld in js/workspace.js)
           for touchscreens, which have no Shift key. -->
      <div id="square-constraint-options" class="rectangle-options hidden">
        <button type="button" id="square-constraint-toggle" class="tool-button square-constraint-button" aria-label="1:1 proportion" data-tooltip="1:1 proportion (like holding Shift)">1:1</button>
      </div>
    </aside>

    <div class="workspace-main">
      <div id="workspace-canvas-container" class="canvas-container">
        <canvas id="workspace-canvas"></canvas>

        <!-- Floats over the canvas's top-left corner (not buried in the
             narrow tools sidebar) - shown only while Pencil or Eraser is
             active (js/workspace.js), same tool-scoped-visibility
             pattern the Brushes panel uses. -->
        <div id="pencil-options" class="pencil-options hidden">
          <div class="pencil-options-row">
            <input type="range" id="pencil-size-slider" class="vertical-slider" min="1" max="20" value="1" aria-label="Size" />
            <span id="pencil-size-readout" class="pencil-options-readout">1px</span>
          </div>
          <div class="pencil-options-row">
            <input type="range" id="pencil-opacity-slider" class="vertical-slider" min="1" max="100" value="100" aria-label="Opacity" />
            <span id="pencil-opacity-readout" class="pencil-options-readout">100%</span>
          </div>
          <!-- Pencil only (hidden for Eraser, see js/workspace.js) - cycles
               through the active Color Library palette per unique pixel
               placed, the same way Rainbow cycles hues, instead of using
               a single foreground color. -->
          <button type="button" id="pencil-library-toggle" class="tool-button icon-button" aria-label="Color Library sequence" data-tooltip="Color Library sequence">
            <span class="material-symbols-outlined">palette</span>
          </button>
        </div>
      </div>

      <!-- Popover anchored to the top bar's gear icon (#canvas-settings-toggle),
           not a docked bottom panel - positioned via fixed + JS
           (js/canvas-settings.js), same clamped-to-viewport pattern
           #color-picker-popover uses. -->
      <div id="canvas-settings-panel" class="canvas-settings-panel hidden">
        <div class="canvas-settings-row canvas-settings-header-row">
          <h2>Canvas Settings</h2>
          <button type="button" id="canvas-settings-close" class="icon-button" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="canvas-settings-row">
          <label class="canvas-settings-name-label">Name
            <input type="text" id="canvas-settings-name" placeholder="Untitled" />
          </label>
        </div>
        <div class="canvas-settings-row">
          <label>W <input type="number" id="canvas-settings-width" min="1" max="256" /></label>
          <label>H <input type="number" id="canvas-settings-height" min="1" max="256" /></label>
          <button type="button" id="canvas-settings-apply" class="tool-button">Resize</button>
        </div>
        <div class="canvas-settings-row">
          <button type="button" id="canvas-settings-rotate-ccw" class="tool-button" data-tooltip="Rotate left">
            <span class="material-symbols-outlined">rotate_left</span> Rotate
          </button>
          <button type="button" id="canvas-settings-rotate-cw" class="tool-button" data-tooltip="Rotate right">
            <span class="material-symbols-outlined">rotate_right</span> Rotate
          </button>
        </div>
      </div>

      <div id="palette-row" class="palette-row"></div>

      <div id="selection-controls" class="selection-controls hidden">
        <button type="button" id="selection-clear-button" class="tool-button no-buzz">Clear selection</button>
        <button type="button" id="selection-delete-button" class="tool-button no-buzz">Delete</button>
      </div>

      <nav class="bottom-bar">
        <!-- 1. Zoom: bottom-left, per the canvas-navigation spec. -->
        <div class="bottom-bar-group zoom-controls">
          <button type="button" id="zoom-out-button" class="tool-button icon-button no-buzz" title="Zoom out (Ctrl/Cmd -)">
            <span class="material-symbols-outlined">remove</span>
          </button>
          <span id="zoom-readout" class="zoom-readout">100%</span>
          <button type="button" id="zoom-in-button" class="tool-button icon-button no-buzz" title="Zoom in (Ctrl/Cmd +)">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="zoom-preset-100" class="tool-button no-buzz" title="Actual size">100%</button>
          <button type="button" id="zoom-preset-fit" class="tool-button no-buzz" title="Fit the canvas to the screen">Fit</button>
          <button type="button" id="zoom-preset-fill" class="tool-button no-buzz" title="Fill the screen with the canvas">Fill</button>
        </div>
      </nav>
    </div>

    <!-- Separate right-hand sidebar, not part of workspace-main's vertical
         stack. Layers is always relevant (shown/hidden by its own toggle,
         see #layers-panel-toggle above); Brushes is scoped to the Brush
         tool (see js/workspace.js) - both independent of each other. -->
    <aside id="right-sidebar" class="right-sidebar">
      <!-- Photoshop-style Layers panel: a shared toolbar (Blend mode +
           Opacity, editing whichever layer is active) above a list of
           compact single-row layers (thumbnail + name + visibility),
           rather than each row carrying its own opacity/blend controls.
           Reorder/delete stay as small per-row icons (Photoshop uses
           drag-and-drop for reordering and a panel-level trash target;
           this app has neither, so tap-to-reorder + a per-row delete
           icon is the closest equivalent). -->
      <div id="layers-panel" class="layers-panel">
        <div class="layers-panel-header">
          <h2>Layers</h2>
          <button type="button" id="add-layer-button" class="tool-button">+ Layer</button>
        </div>
        <div class="layers-panel-toolbar">
          <select id="layers-panel-blend-select" class="layers-panel-blend-select" aria-label="Blend mode"></select>
          <div class="layers-panel-opacity" data-tooltip="Opacity">
            <span class="material-symbols-outlined layers-panel-opacity-icon">opacity</span>
            <input type="range" id="layers-panel-opacity-slider" class="layers-panel-opacity-slider" min="0" max="100" value="100" aria-label="Layer opacity" />
            <span id="layers-panel-opacity-readout" class="layers-panel-opacity-readout">100%</span>
          </div>
        </div>
        <!-- Toolbar's two rows stack instead of sharing one line -
             the right-sidebar's ~13rem width can't fit a blend
             dropdown, "Opacity" label, slider, and percentage on a
             single line the way Photoshop's wider desktop panel can
             (an earlier attempt at one line overflowed the sidebar). -->
        <div id="layers-panel-list" class="layers-panel-list"></div>
      </div>

      <div id="brushes-panel" class="brushes-panel">
        <div class="brushes-panel-header">
          <h2>Brushes</h2>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Spacing
            <input type="number" id="brush-spacing" min="1" max="20" value="1" /> px
          </label>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Rotation
            <input type="number" id="brush-rotation" min="0" max="359" value="0" /> °
          </label>
        </div>
        <div id="brushes-panel-grid" class="brushes-panel-grid"></div>
        <div class="brushes-panel-toolbar">
          <button type="button" id="add-brush-button" class="tool-button icon-button" title="Add brush">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="delete-brush-button" class="tool-button icon-button no-buzz" disabled title="Delete selected brush">
            <span class="material-symbols-outlined">delete</span>
          </button>
          <!-- Same Color Library sequence toggle as Pencil's
               (#pencil-library-toggle) - a separate DOM instance since
               #pencil-options (Pencil/Eraser only) and #brushes-panel
               (Brush only) are never both visible at once, both wired to
               the same state.colorLibrarySequence flag in js/workspace.js. -->
          <button type="button" id="brush-library-toggle" class="tool-button icon-button" aria-label="Color Library sequence" data-tooltip="Color Library sequence">
            <span class="material-symbols-outlined">palette</span>
          </button>
        </div>

        <div id="brush-editor-panel" class="brush-editor-panel hidden">
          <div class="brush-editor-row">
            <h2>New Brush</h2>
          </div>
          <div class="brush-editor-row">
            <input type="text" id="brush-editor-name" placeholder="Brush name" />
          </div>
          <div class="brush-editor-row">
            <label class="brush-editor-size-label">W
              <input type="number" id="brush-editor-width" min="3" value="9" />
            </label>
            <label class="brush-editor-size-label">H
              <input type="number" id="brush-editor-height" min="3" value="9" />
            </label>
          </div>
          <div id="brush-editor-grid" class="brush-editor-grid"></div>
          <div class="brush-editor-row">
            <button type="button" id="brush-editor-clear" class="tool-button">Clear</button>
            <button type="button" id="brush-editor-cancel" class="tool-button">Cancel</button>
            <button type="button" id="brush-editor-save" class="tool-button">Save</button>
          </div>
        </div>
      </div>

      <!-- Named, persisted palettes of user-added colors - global and
           cross-session, unlike the fixed preset palette-row. -->
      <div id="color-library-panel" class="color-library-panel">
        <div class="color-library-header">
          <h2>Color Library</h2>
          <div class="color-library-header-actions">
            <!-- Adds the current Foreground color to the active palette
                 - always available regardless of platform, unlike the
                 color-picker popover's own "Add to palette" (that
                 popover doesn't exist on iOS - see openColorPicker in
                 js/workspace.js - so this is the only path there). -->
            <button type="button" id="add-current-color-button" class="tool-button icon-button" aria-label="Add current color to palette" data-tooltip="Add current color">
              <span class="material-symbols-outlined">playlist_add</span>
            </button>
            <button type="button" id="add-palette-button" class="tool-button icon-button" aria-label="Add palette" data-tooltip="New palette">
              <span class="material-symbols-outlined">add</span>
            </button>
            <button type="button" id="delete-palette-button" class="tool-button icon-button no-buzz" aria-label="Delete palette" data-tooltip="Delete palette">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
        <select id="color-library-select" class="color-library-select hidden"></select>
        <div id="new-palette-row" class="new-palette-row hidden">
          <input type="text" id="new-palette-name" placeholder="Palette name" />
          <button type="button" id="new-palette-save" class="tool-button">Save</button>
          <button type="button" id="new-palette-cancel" class="tool-button">Cancel</button>
        </div>
        <div id="color-library-grid" class="color-library-grid"></div>
      </div>
    </aside>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
