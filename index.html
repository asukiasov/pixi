<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Un-deferred classic script (not type="module" - those always defer,
       see the file's own comment for why that matters here), loaded
       before the stylesheet so the resolved theme is on <html> before
       the browser's first paint - prevents a dark-then-light flash for
       light/system-light users. Must stay early in <head>, ahead of
       anything that would let the page start rendering first. -->
  <script src="js/theme-boot.js"></script>
  <title>Pixi</title>
  <!-- Colors the browser UI chrome (mobile address bar, task switcher) to
       match the app's current theme. Static fallback here (dark, this
       app's original/default look); js/theme.js keeps `content` in sync
       with the resolved light/dark theme as the user toggles it. -->
  <meta name="theme-color" content="#1c1c1e" />
  <link rel="stylesheet" href="style.css" />
  <!-- Resolves bare "dexie" imports in js/persistence.js to a CDN build, no
       npm/bundler for the shipped app. Node resolves the same bare
       specifier from node_modules, for `node --test` only. -->
  <script type="importmap">
    { "imports": { "dexie": "https://esm.sh/dexie@4" } }
  </script>
  <!-- Google Material Symbols, for tool/undo/redo icons (see style.css).
       A single static axis point (not a variable-font range) plus
       icon_names subsetting to just the glyphs actually used — the
       original range query pulled the full variable font (~4MB, ~30s on a
       slow connection, icons invisible until it finished); this is a few
       KB. Keep icon_names in sync with the icons used in this file, AND
       keep it sorted alphabetically — the Google Fonts API 400s the whole
       request (breaking every icon on the page, not just an unsorted one)
       if icon_names isn't in alphabetical order. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,arrow_downward,arrow_selector_tool,arrow_upward,back_hand,blur_off,blur_on,brightness_auto,brush,check_box,check_box_outline_blank,close,colorize,crop_free,dark_mode,delete,dock_to_right,download,edit,expand_more,format_color_fill,home,horizontal_rule,ink_eraser,light_mode,lock,rectangle,redo,remove,restart_alt,swap_horiz,undo,visibility,visibility_off" />
</head>
<body>
  <main id="screen-gallery" class="screen">
    <div class="gallery-header">
      <h1>Pixi</h1>
      <button type="button" id="gallery-new-canvas-button" class="primary-button">+ New Canvas</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <p id="gallery-empty-state" class="gallery-empty-state hidden">
      No projects yet — tap "+ New Canvas" to start one.
    </p>
    <!-- Cache sanity check, not a feature - lets you tell a stale cached
         copy apart from the real latest deploy. Populated from
         js/version.js (see app.js), which scripts/stamp-version.sh keeps
         current. -->
    <p id="version-badge" class="version-badge"></p>
  </main>

  <main id="screen-new-canvas" class="screen hidden">
    <h1>New Canvas</h1>

    <section class="field-group">
      <h2>Size</h2>
      <div class="preset-row" id="size-presets">
        <button type="button" class="preset-button" data-size="16">16×16</button>
        <button type="button" class="preset-button" data-size="32">32×32</button>
        <button type="button" class="preset-button" data-size="64">64×64</button>
        <button type="button" class="preset-button" data-size="128">128×128</button>
      </div>
      <div class="custom-size-row">
        <label>W <input type="number" id="custom-width" min="1" max="256" placeholder="e.g. 24…" /></label>
        <label>H <input type="number" id="custom-height" min="1" max="256" placeholder="e.g. 96…" /></label>
      </div>
    </section>

    <section class="field-group">
      <h2>Background</h2>
      <div class="preset-row" id="background-choice">
        <label><input type="radio" name="background" value="transparent" checked /> Transparent</label>
        <label><input type="radio" name="background" value="white" /> White</label>
      </div>
    </section>

    <button type="button" id="create-canvas-button" class="primary-button">Create</button>
  </main>

  <main id="screen-workspace" class="screen workspace-screen hidden">
    <!-- Top bar: navigation/toggles/settings/export, icon-only. Separate
         from the tool rail below - these aren't drawing tools. -->
    <header class="workspace-topbar">
      <button type="button" id="back-to-gallery-button" class="tool-button icon-button magnetic-hover" aria-label="Gallery" data-tooltip="Gallery">
        <span class="material-symbols-outlined">home</span>
      </button>
      <!-- Pro-only (split-pixi-pro-repo): Layers panel toggle. Present
           in pixi-pro's own index.html (own copy of this markup) but not
           here - see js/workspace.js's getLayerStack/renderCanvas/
           commit/registerAfterCommit/registerAfterUndoRedo/
           registerMergeShortcut/onWorkspaceReset. -->
      <button type="button" id="export-button" class="tool-button icon-button magnetic-hover" aria-label="Export PNG" data-tooltip="Export PNG">
        <span class="material-symbols-outlined">download</span>
      </button>
      <!-- drawing-timelapse-recording: opt-in capture of one composited
           frame per commit (js/workspace.js's commit(), via
           js/timelapse.js), independent of the undo stack. .recording
           (styled in style.css, a small pulsing red dot) marks the active
           state - shares .active's accent-fill styling with every other
           topbar toggle in addition, so it still reads as "on" even
           without the pulse (prefers-reduced-motion, or the dot alone
           being an insufficient color-only signal). -->
      <button type="button" id="record-toggle" class="tool-button icon-button magnetic-hover" aria-label="Record timelapse" data-tooltip="Record timelapse">
        <span class="material-symbols-outlined">fiber_manual_record</span>
      </button>

      <div class="workspace-topbar-spacer"></div>

      <button type="button" id="undo-button" class="tool-button icon-button magnetic-hover" disabled aria-label="Undo" data-tooltip="Undo">
        <span class="material-symbols-outlined">undo</span>
      </button>
      <button type="button" id="redo-button" class="tool-button icon-button magnetic-hover" disabled aria-label="Redo" data-tooltip="Redo">
        <span class="material-symbols-outlined">redo</span>
      </button>
      <!-- VSCode-style whole-panel toggle: hides/shows the entire right
           sidebar (Color Library + Brushes + Layers together), independent
           of each panel's own collapsed state (Pro-only panels have their
           own collapse toggles too - split-pixi-pro-repo). Right end of
           the top bar, closest to the panel it controls - see
           js/workspace.js. -->
      <button type="button" id="right-sidebar-toggle" class="tool-button icon-button active magnetic-hover" aria-label="Right panel" data-tooltip="Right panel">
        <span class="material-symbols-outlined">dock_to_right</span>
      </button>
      <!-- Light/dark/system theme toggle. Right end of the top bar, after
           the right-sidebar toggle - see js/theme.js. Icon/label/tooltip
           are set by initThemeToggle() to reflect the current preference
           (light_mode/dark_mode/brightness_auto); the values below are
           just the pre-JS fallback (system is the default preference). -->
      <button type="button" id="theme-toggle" class="tool-button icon-button magnetic-hover" aria-label="Theme: System" data-tooltip="Theme: System">
        <span class="material-symbols-outlined">brightness_auto</span>
      </button>
    </header>

    <div class="workspace-body">
    <!-- 1. Tools: vertical icon rail, Photoshop-style. -->
    <aside id="tools-sidebar" class="tools-sidebar">
      <button type="button" class="tool-button magnetic-hover" data-tool="move" aria-label="Move" data-tooltip="Move" data-shortcut="V">
        <span class="material-symbols-outlined">arrow_selector_tool</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="pencil" aria-label="Pencil" data-tooltip="Pencil" data-shortcut="P">
        <span class="material-symbols-outlined">edit</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="eraser" aria-label="Eraser" data-tooltip="Eraser" data-shortcut="E">
        <span class="material-symbols-outlined">ink_eraser</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="bucket" aria-label="Bucket" data-tooltip="Bucket" data-shortcut="G">
        <span class="material-symbols-outlined">format_color_fill</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="brush" aria-label="Brush" data-tooltip="Brush" data-shortcut="B">
        <span class="material-symbols-outlined">brush</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="line" aria-label="Line" data-tooltip="Line" data-shortcut="L">
        <span class="material-symbols-outlined">horizontal_rule</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="rectangle" aria-label="Rectangle" data-tooltip="Rectangle" data-shortcut="R">
        <span class="material-symbols-outlined">rectangle</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="selection" aria-label="Select" data-tooltip="Select (click outside or Esc to deselect)" data-shortcut="M">
        <span class="material-symbols-outlined">crop_free</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="hand" aria-label="Hand (pan)" data-tooltip="Hand" data-shortcut="H">
        <span class="material-symbols-outlined">back_hand</span>
      </button>
      <button type="button" class="tool-button magnetic-hover" data-tool="eyedropper" aria-label="Eyedropper" data-tooltip="Eyedropper" data-shortcut="I">
        <span class="material-symbols-outlined">colorize</span>
      </button>

      <!-- Foreground/Background - always relevant (not tool-scoped),
           unlike the Pencil options below. Reset/swap are small icons
           overlapping the swatch stack's corners (Photoshop-style),
           not full-size buttons stacked above/below it. -->
      <div class="fg-bg-swatches">
        <div class="fg-bg-swatch-stack">
          <button type="button" id="background-swatch" class="fg-bg-swatch bg-swatch" aria-label="Background color" data-tooltip="Background color"></button>
          <button type="button" id="foreground-swatch" class="fg-bg-swatch fg-swatch" aria-label="Foreground color" data-tooltip="Foreground color"></button>
          <button type="button" id="fg-bg-swap" class="fg-bg-corner-button swap-corner" aria-label="Swap colors" data-tooltip="Swap colors">
            <span class="material-symbols-outlined">swap_horiz</span>
          </button>
          <button type="button" id="fg-bg-reset" class="fg-bg-corner-button reset-corner" aria-label="Reset colors" data-tooltip="Reset colors">
            <span class="material-symbols-outlined">restart_alt</span>
          </button>
        </div>
      </div>

      <!-- Popover opened by clicking either FG/BG swatch above - edits
           whichever one was clicked (js/workspace.js tracks the target).
           Positioned via fixed + JS (getBoundingClientRect), clamped to
           the viewport, so its DOM location doesn't matter. -->
      <div id="color-picker-popover" class="color-picker-popover hidden">
        <div class="color-picker-popover-header">
          <span id="color-picker-popover-title">Foreground Color</span>
          <button type="button" id="color-picker-close" class="icon-button" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <input type="color" id="color-picker-native" value="#000000" title="Custom color" />
        <div class="color-picker-hex-row">
          <input type="text" id="color-picker-hex" class="color-picker-hex" value="#000000" maxlength="7" placeholder="#000000" aria-label="Hex" title="Double-click to copy" />
          <span id="color-picker-copied" class="color-picker-copied hidden" role="status" aria-live="polite">Copied!</span>
        </div>
        <div class="color-picker-rgb-row">
          <input type="number" id="color-picker-r" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Red" />
          <input type="number" id="color-picker-g" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Green" />
          <input type="number" id="color-picker-b" class="color-picker-rgb" min="0" max="255" value="0" aria-label="Blue" />
        </div>
        <!-- Pro-only (split-pixi-pro-repo): "Add to palette" and
             "Generate ramp" buttons, embedded in this otherwise-Standard
             popover. Present in pixi-pro's own index.html (own copy of
             this markup) but not here - see js/workspace.js's
             getColorPickerCurrentColor. -->
      </div>

      <!-- Shown only while Pencil or Eraser is active (js/workspace.js),
           same tool-scoped-visibility pattern the Brushes panel uses. -->
      <!-- 1:1 (square) proportion toggle - shown for Rectangle and
           Selection, an on/off equivalent of holding Shift while
           dragging (see squareDragCurrent/shiftHeld in js/workspace.js)
           for touchscreens, which have no Shift key. -->
      <div id="square-constraint-options" class="rectangle-options hidden">
        <button type="button" id="square-constraint-toggle" class="tool-button square-constraint-button" aria-label="1:1 proportion" data-tooltip="1:1 proportion (like holding Shift)">1:1</button>
      </div>

      <!-- Pro-only (split-pixi-pro-repo): Color Library sequence toggle,
           shown for Pencil and Brush. Present in pixi-pro's own
           index.html (own copy of this markup) but not here - see
           js/workspace.js's registerColorSequenceProvider/
           registerDisableColorLibrarySequence/disableRainbow. -->
    </aside>

    <div class="workspace-main">
      <div id="workspace-canvas-container" class="canvas-container">
        <canvas id="workspace-canvas"></canvas>

        <!-- Floats over the canvas's top-left corner (not buried in the
             narrow tools sidebar) - shown only while Pencil or Eraser is
             active (js/workspace.js), same tool-scoped-visibility
             pattern the Brushes panel uses. -->
        <div id="pencil-options" class="pencil-options hidden">
          <div class="pencil-options-row">
            <input type="range" id="pencil-size-slider" class="vertical-slider" min="1" max="20" value="1" aria-label="Size" />
            <span id="pencil-size-readout" class="pencil-options-readout">1px</span>
          </div>
          <!-- Pro-only (split-pixi-pro-repo): Opacity row, present in
               pixi-pro's own index.html (own copy of this markup, see
               that repo's README) but not here. -->
        </div>
      </div>

      <!-- Pro-only (split-pixi-pro-repo): Canvas Settings popover.
           Present in pixi-pro's own index.html (own copy of this markup)
           but not here - see js/workspace.js's resizeCanvas/rotateCanvas/
           renameCurrentProject/onWorkspaceReset. -->

      <!-- Popover anchored to the top bar's download icon (#export-button),
           same clamped-to-viewport pattern as the Pro-only Canvas Settings
           popover
           (js/export.js). Scale, format, and the transparent-background
           toggle are transient UI state - reset to their defaults every
           time the popover opens, not persisted with the project. -->
      <div id="export-panel" class="canvas-settings-panel export-panel hidden">
        <div class="canvas-settings-row canvas-settings-header-row">
          <h2>Export</h2>
          <button type="button" id="export-close" class="icon-button" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="canvas-settings-row export-scale-row" role="radiogroup" aria-label="Scale">
          <button type="button" class="tool-button export-scale-option active" data-scale="1">1x</button>
          <button type="button" class="tool-button export-scale-option" data-scale="2">2x</button>
          <button type="button" class="tool-button export-scale-option" data-scale="4">4x</button>
          <button type="button" class="tool-button export-scale-option" data-scale="8">8x</button>
        </div>
        <div class="canvas-settings-row export-format-row" role="radiogroup" aria-label="Format">
          <button type="button" class="tool-button export-format-option active" data-format="png">PNG</button>
          <button type="button" class="tool-button export-format-option" data-format="webp">WebP</button>
          <button type="button" class="tool-button export-format-option" data-format="jpg">JPG</button>
        </div>
        <div class="canvas-settings-row">
          <label id="export-transparent-label">
            <input type="checkbox" id="export-transparent-background" />
            Transparent background
          </label>
        </div>
        <div class="canvas-settings-row">
          <button type="button" id="export-download" class="tool-button export-download-button">
            <span class="material-symbols-outlined">download</span> Export
          </button>
        </div>
      </div>

      <!-- drawing-timelapse-recording: review popover anchored to the top
           bar's #record-toggle, same clamped-to-viewport pattern as
           #export-panel. Opens when the Record toggle is turned off with
           at least one frame captured (js/workspace.js) - never opens for
           an empty recording, per the spec's "Stopping with no captured
           frames" scenario. No format selector (design.md: WebM via
           MediaRecorder is the only option, not a meaningful user-facing
           choice like Export's PNG/WebP/JPG). -->
      <div id="timelapse-review-panel" class="canvas-settings-panel timelapse-review-panel hidden">
        <div class="canvas-settings-row canvas-settings-header-row">
          <h2>Timelapse</h2>
          <button type="button" id="timelapse-review-close" class="icon-button" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="canvas-settings-row">
          <span id="timelapse-frame-count" class="timelapse-frame-count"></span>
        </div>
        <div class="canvas-settings-row">
          <label for="timelapse-speed-slider">Speed</label>
          <input type="range" id="timelapse-speed-slider" min="1" max="30" value="8" step="1" aria-label="Playback speed (frames per second)" />
          <span id="timelapse-speed-readout" class="timelapse-speed-readout">8 fps</span>
        </div>
        <div class="canvas-settings-row">
          <button type="button" id="timelapse-save" class="tool-button export-download-button">
            <span class="material-symbols-outlined">download</span> Save video
          </button>
        </div>
      </div>

      <div id="palette-row" class="palette-row"></div>

      <div id="selection-controls" class="selection-controls hidden">
        <button type="button" id="selection-clear-button" class="tool-button no-buzz">Clear selection</button>
        <button type="button" id="selection-delete-button" class="tool-button no-buzz">Delete</button>
      </div>

      <nav class="bottom-bar">
        <!-- 1. Zoom: bottom-left, per the canvas-navigation spec. -->
        <div class="bottom-bar-group zoom-controls">
          <button type="button" id="zoom-out-button" class="tool-button icon-button no-buzz" title="Zoom out (Ctrl/Cmd -)">
            <span class="material-symbols-outlined">remove</span>
          </button>
          <span id="zoom-readout" class="zoom-readout">100%</span>
          <button type="button" id="zoom-in-button" class="tool-button icon-button no-buzz" title="Zoom in (Ctrl/Cmd +)">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="zoom-preset-100" class="tool-button no-buzz" title="Actual size">100%</button>
          <button type="button" id="zoom-preset-fit" class="tool-button no-buzz" title="Fit the canvas to the screen">Fit</button>
          <button type="button" id="zoom-preset-fill" class="tool-button no-buzz" title="Fill the screen with the canvas">Fill</button>
        </div>
      </nav>
    </div>

    <!-- Separate right-hand sidebar, not part of workspace-main's vertical
         stack. Order: Color Library (used most while drawing) → Brushes
         (tool-scoped, see js/workspace.js) → Layers - each section has
         its own collapse-to-header state (click its heading), and the
         whole sidebar has its own show/hide (#right-sidebar-toggle
         above), independent of one another. -->
    <aside id="right-sidebar" class="right-sidebar">
      <!-- Pro-only (split-pixi-pro-repo): Color Library panel, plus its
           import-palette and generate-ramp popovers. Present in
           pixi-pro's own index.html (own copy of this markup) but not
           here - see js/workspace.js's registerColorSequenceProvider/
           bindPanelHeaderCollapse/matrixRain/confettiBurst/
           setForegroundColor/hexToRgba/rgbaToHex/getColorPickerCurrentColor/
           registerActiveSwatchSync/onWorkspaceReset. -->

      <div id="brushes-panel" class="brushes-panel">
        <div class="brushes-panel-header">
          <h2>Brushes</h2>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Spacing
            <input type="number" id="brush-spacing" min="1" max="20" value="1" /> px
          </label>
        </div>
        <div class="brushes-panel-row">
          <label class="brushes-spacing-label">Rotation
            <input type="number" id="brush-rotation" min="0" max="359" value="0" /> °
          </label>
        </div>
        <div id="brushes-panel-grid" class="brushes-panel-grid"></div>
        <div class="brushes-panel-toolbar">
          <button type="button" id="add-brush-button" class="tool-button icon-button" aria-label="Add brush" data-tooltip="Add brush">
            <span class="material-symbols-outlined">add</span>
          </button>
          <button type="button" id="delete-brush-button" class="tool-button icon-button no-buzz" disabled aria-label="Delete selected brush" data-tooltip="Delete selected brush">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>

        <div id="brush-editor-panel" class="brush-editor-panel hidden">
          <div class="brush-editor-row brush-editor-header-row">
            <h2>New Brush</h2>
            <!-- Pro-only (split-pixi-pro-repo): Import an image to
                 pre-fill the grid. Present in pixi-pro's own index.html
                 (own copy of this markup) but not here - see
                 js/workspace.js's setBrushEditorGrid. -->
          </div>
          <div class="brush-editor-row">
            <input type="text" id="brush-editor-name" placeholder="Brush name" />
          </div>
          <div class="brush-editor-row">
            <label class="brush-editor-size-label">W
              <input type="number" id="brush-editor-width" min="3" value="9" />
            </label>
            <label class="brush-editor-size-label">H
              <input type="number" id="brush-editor-height" min="3" value="9" />
            </label>
          </div>
          <div id="brush-editor-grid" class="brush-editor-grid"></div>
          <div class="brush-editor-row">
            <button type="button" id="brush-editor-clear" class="tool-button">Clear</button>
            <button type="button" id="brush-editor-cancel" class="tool-button">Cancel</button>
            <button type="button" id="brush-editor-save" class="tool-button">Save</button>
          </div>
        </div>
      </div>

      <!-- Pro-only (split-pixi-pro-repo): Photoshop-style Layers panel.
           Present in pixi-pro's own index.html (own copy of this
           markup) but not here - see js/workspace.js's getLayerStack/
           renderCanvas/commit/registerAfterCommit/registerAfterUndoRedo/
           registerMergeShortcut/onWorkspaceReset. Bottom-most section -
           see #right-sidebar above for why. -->
    </aside>

    <!-- Pro-only (split-pixi-pro-repo): opacity popover for the Layers
         toolbar. Present in pixi-pro's own index.html but not here. -->
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
